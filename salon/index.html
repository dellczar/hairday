<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A salon on Hairday</title>
<meta name="description" content="Open this salon in the Hairday app to see services, prices and open times.">
<meta name="robots" content="noindex">
<link rel="icon" href="../assets/icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap">
<style>
  /* Tokens from docs/SPEC.md §5 */
  :root{--bg:#F7F4EE;--surface:#FFFFFF;--ink:#171826;--muted:#5D6070;--line:#E5DFD5;--goldText:#8F5A0E;
        --display:"Instrument Serif",Georgia,serif;--body:"Inter",ui-sans-serif,system-ui,-apple-system,sans-serif;color-scheme:light}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--ink);font:400 16px/1.6 var(--body);padding:24px 20px}
  main{max-width:420px;text-align:center}
  img{height:52px;width:auto;margin:0 auto 28px;display:block}
  h1{font:400 44px/1.02 var(--display);letter-spacing:-.01em;margin:0 0 12px}
  h1 em{color:var(--goldText)}
  p{color:var(--muted);margin:0 0 28px}
  a.btn{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:0 28px;border-radius:999px;background:var(--ink);color:#fff;text-decoration:none;font-weight:600}
  a.btn:focus-visible{outline:2px solid var(--goldText);outline-offset:3px}
  small{display:block;margin-top:22px;color:var(--muted);font-size:13px}
  small a{color:inherit}
</style>
</head>
<body>
<main>
  <img src="../assets/logo.png" alt="Hairday">
  <h1>Someone shared a <em>salon.</em></h1>
  <p>Open it in the Hairday app to see services, prices and open times.</p>
  <a class="btn" id="open" href="hairday://">Open in Hairday</a>
  <small>Don’t have the app yet? It’s coming soon to iPhone and Android. <a href="/">Learn more</a></small>
</main>
<script>
  // Shared links look like hairday.app/salon/?id=<salon id>. The id is checked so only a plain id ends up in the app link.
  var id = new URLSearchParams(location.search).get('id') || '';
  if (/^[A-Za-z0-9-]{1,64}$/.test(id)) {
    var link = 'hairday://salon/' + id;
    document.getElementById('open').href = link;
    if (/iPhone|iPad|Android/i.test(navigator.userAgent)) location.href = link;
  }
</script>
</body>
</html>
