<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hairday · Add professional</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#171826}a:hover{color:#8F5A0E}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F7F4EE; color: #171826; font-family: Inter, system-ui, sans-serif; position: relative; overflow: hidden">
  <div style="padding: 52px 20px 0; display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; align-items: center; gap: 12px">
      <a href="Services.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 50%; background: #FFFFFF; border: 1px solid #E5DFD5; display: flex; align-items: center; justify-content: center; color: #171826; flex-shrink: 0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></a>
      <span style="font-size: 17px; font-weight: 600; flex-grow: 1">Add professional</span>
      <a href="Pro.html" style="font-size: 14px; font-weight: 600">Preview</a>
    </div>
    <div style="display: flex; align-items: center; gap: 14px">
      <button type="button" aria-label="Add profile photo" style="width: 72px; height: 72px; border-radius: 50%; border: 1.5px dashed #CBBFB2; background: transparent; display: flex; align-items: center; justify-content: center; color: #5D6070; flex-shrink: 0; padding: 0"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg></button>
      <div style="flex-grow: 1; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
        <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600">First name<input value="April" style="height: 48px; border: 1px solid #E5DFD5; border-radius: 14px; background: #FFFFFF; padding: 0 12px; font: 400 15px Inter, sans-serif; color: #171826; min-width: 0"></label>
        <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600">Last name<input value="Olson" style="height: 48px; border: 1px solid #E5DFD5; border-radius: 14px; background: #FFFFFF; padding: 0 12px; font: 400 15px Inter, sans-serif; color: #171826; min-width: 0"></label>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px"><span style="font-size: 13px; font-weight: 600">Role</span>
      <div style="display: flex; flex-wrap: wrap; gap: 8px">
        <sc-for list="{{roles}}" as="r" hint-placeholder-count="6"><button type="button" aria-pressed="{{r.on}}" onClick="{{r.pick}}" style="height: 38px; padding: 0 14px; border-radius: 999px; border: 1px solid {{r.bd}}; background: {{r.bg}}; color: {{r.fg}}; font: 500 13px Inter, sans-serif">{{r.label}}</button></sc-for>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px"><span style="font-size: 13px; font-weight: 600">Services they offer</span>
      <div style="background: #FFFFFF; border: 1px solid #ECE6DC; border-radius: 16px; padding: 0 14px">
        <sc-for list="{{svcs}}" as="v" hint-placeholder-count="4">
          <button type="button" role="checkbox" aria-checked="{{v.on}}" onClick="{{v.pick}}" style="width: 100%; min-height: 50px; border: 0; border-bottom: 1px solid {{v.line}}; background: transparent; padding: 0; display: flex; align-items: center; gap: 12px; font: 400 15px Inter, sans-serif; color: #171826; text-align: left">
            <span style="width: 22px; height: 22px; border-radius: 7px; box-sizing: border-box; border: 1.5px solid {{v.box}}; background: {{v.fill}}; display: flex; align-items: center; justify-content: center; color: #FFFFFF; flex-shrink: 0"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span>
            <span style="flex-grow: 1">{{v.label}}</span><span style="font-size: 13px; color: #5D6070">{{v.meta}}</span>
          </button>
        </sc-for>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px"><span style="font-size: 13px; font-weight: 600">Portfolio</span>
      <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px">
        <div style="height: 76px; border-radius: 12px; background: #CBBFB2"></div>
        <div style="height: 76px; border-radius: 12px; background: #BFAE9C"></div>
        <div style="height: 76px; border-radius: 12px; background: #D8CCBF"></div>
        <button type="button" aria-label="Add portfolio photos" style="height: 76px; border-radius: 12px; border: 1.5px dashed #CBBFB2; background: transparent; display: flex; align-items: center; justify-content: center; color: #5D6070; padding: 0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
      </div>
    </div>
  </div>
  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 20px 30px; background: #F7F4EE">
    <a href="Availability.html" style="display: flex; align-items: center; justify-content: center; height: 54px; border-radius: 999px; background: #171826; color: #FFFFFF; text-decoration: none; font-size: 15px; font-weight: 600">Save and set hours</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#F4A942","options":["#F4A942","#171826","#D58E39"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { role: 'Hair stylist', svc: [true, true, false, false] };
  }
  renderVals() {
    const accent = this.props.accent ?? '#F4A942';
    const s = this.state || { role: 'Hair stylist', svc: [true, true, false, false] };
    const chip = (on) => ({ bg: on ? '#171826' : '#FFFFFF', fg: on ? '#FFFFFF' : '#171826', bd: on ? '#171826' : '#E5DFD5' });
    const roles = ['Hair stylist', 'Barber', 'Colorist', 'Braider', 'Nail tech', 'Lash artist'].map((label) => ({
      label, on: s.role === label, ...chip(s.role === label), pick: () => this.setState({ role: label })
    }));
    const list = [['Adult cut', '30 min'], ['Cut & shampoo', '45 min'], ['Cut, shampoo & style', '1 hr'], ['Box braids', '3 hr']];
    const svcs = list.map(([label, meta], i) => ({
      label, meta, on: s.svc[i],
      box: s.svc[i] ? '#171826' : '#CBBFB2',
      fill: s.svc[i] ? '#171826' : 'transparent',
      line: i === list.length - 1 ? 'transparent' : '#EFEAE2',
      pick: () => { const a = s.svc.slice(); a[i] = !a[i]; this.setState({ svc: a }); }
    }));
    return { accent, roles, svcs };
  }
}
</script>
</body>
</html>
