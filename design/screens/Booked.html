<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hairday · Booked</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#171826}a:hover{color:#8F5A0E}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F7F4EE; color: #171826; font-family: Inter, system-ui, sans-serif; position: relative; overflow: hidden; display: flex; flex-direction: column; padding: 96px 20px 34px">
  <div style="display: flex; flex-direction: column; align-items: center; text-align: center; gap: 14px">
    <div style="width: 84px; height: 84px; border-radius: 50%; background: {{accent}}; color: #171826; display: flex; align-items: center; justify-content: center"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></div>
    <h1 style="margin: 8px 0 0; font-family: 'Instrument Serif', serif; font-weight: 400; font-size: 44px; line-height: 1; letter-spacing: -1px">You're <em style="color: #8F5A0E">booked.</em></h1>
    <p style="margin: 0; font-size: 15px; line-height: 1.45; color: #5D6070; max-width: 290px">We sent the details to your email. You'll get a reminder the day before.</p>
  </div>
  <div style="margin-top: 32px; background: #FFFFFF; border: 1px solid #ECE6DC; border-radius: 20px; overflow: hidden">
    <div style="padding: 18px; display: flex; gap: 14px; align-items: center">
      <div style="width: 56px; height: 60px; border-radius: 14px; background: #171826; color: #FFFFFF; display: flex; flex-direction: column; align-items: center; justify-content: center"><span style="font-size: 11px; font-weight: 600; letter-spacing: 1.2px">NOV</span><span style="font-family: 'Instrument Serif', serif; font-size: 28px; line-height: 1">14</span></div>
      <div style="display: flex; flex-direction: column; gap: 3px"><span style="font-size: 16px; font-weight: 600">Saturday · 2:30 PM</span><span style="font-size: 14px; color: #5D6070">Adult cut with April · 30 min</span><span style="font-size: 14px; color: #5D6070">Lisa's Salon, 555 Main St</span></div>
    </div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border-top: 1px solid #EFEAE2">
      <button type="button" style="height: 52px; border: 0; border-right: 1px solid #EFEAE2; background: transparent; display: flex; align-items: center; justify-content: center; gap: 8px; font: 500 14px Inter, sans-serif; color: #171826"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"></rect><path d="M4 10h16M9 3v4M15 3v4M12 13v4M10 15h4"></path></svg>Add to calendar</button>
      <button type="button" style="height: 52px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; gap: 8px; font: 500 14px Inter, sans-serif; color: #171826"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l18-8-8 18-2-8z"></path></svg>Directions</button>
    </div>
  </div>
  <div style="flex-grow: 1"></div>
  <div style="display: flex; flex-direction: column; gap: 10px">
    <a href="MyBookings.html" style="display: flex; align-items: center; justify-content: center; height: 52px; border-radius: 999px; background: #171826; color: #FFFFFF; text-decoration: none; font-size: 15px; font-weight: 600">View my bookings</a>
    <a href="Main.html" style="display: flex; align-items: center; justify-content: center; height: 48px; text-decoration: none; font-size: 15px; font-weight: 500">Back to home</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#F4A942","options":["#F4A942","#171826","#D58E39"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#F4A942' };
  }
}
</script>
</body>
</html>
