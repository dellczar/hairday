<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hairday · Leave a review</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#171826}a:hover{color:#8F5A0E}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F7F4EE; color: #171826; font-family: Inter, system-ui, sans-serif; position: relative; overflow: hidden; display: flex; flex-direction: column; padding: 52px 20px 34px; gap: 20px">
  <a href="MyBookings.html" aria-label="Close" style="width: 44px; height: 44px; border-radius: 50%; background: #FFFFFF; border: 1px solid #E5DFD5; display: flex; align-items: center; justify-content: center; color: #171826"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
  <div style="display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px">
    <div role="img" aria-label="Jade" style="width: 72px; height: 72px; border-radius: 50%; background: #E2D6C9; display: flex; align-items: center; justify-content: center; font-family: 'Instrument Serif', serif; font-size: 28px">JK</div>
    <h1 style="margin: 6px 0 0; font-family: 'Instrument Serif', serif; font-weight: 400; font-size: 34px; line-height: 1.05">How was your visit<br>with <em style="color: #8F5A0E">Jade?</em></h1>
    <span style="font-size: 14px; color: #5D6070">Box braids · Oct 21 · Lisa's Salon</span>
  </div>
  <div role="radiogroup" aria-label="Rating" style="display: flex; justify-content: center; gap: 6px">
    <sc-for list="{{stars}}" as="st" hint-placeholder-count="5">
      <button type="button" role="radio" aria-checked="{{st.checked}}" aria-label="{{st.label}}" onClick="{{st.pick}}" style="width: 52px; height: 52px; border: 0; background: transparent; padding: 0; display: flex; align-items: center; justify-content: center">
        <svg width="38" height="38" viewBox="0 0 24 24" fill="{{st.fill}}" stroke="{{st.stroke}}" stroke-width="1.4" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"></path></svg>
      </button>
    </sc-for>
  </div>
  <span style="text-align: center; font-size: 15px; font-weight: 600; margin-top: -8px">{{ratingWord}}</span>
  <div style="display: flex; flex-wrap: wrap; gap: 8px; justify-content: center">
    <sc-for list="{{tags}}" as="t" hint-placeholder-count="5">
      <button type="button" aria-pressed="{{t.on}}" onClick="{{t.pick}}" style="height: 38px; padding: 0 14px; border-radius: 999px; border: 1px solid {{t.bd}}; background: {{t.bg}}; color: {{t.fg}}; font: 500 13px Inter, sans-serif">{{t.label}}</button>
    </sc-for>
  </div>
  <label style="display: flex; flex-direction: column; gap: 8px; font-size: 14px; font-weight: 600">Tell others about it (optional)
    <textarea rows="4" placeholder="What did you love?" style="border: 1px solid #E5DFD5; border-radius: 16px; background: #FFFFFF; padding: 14px; font: 400 15px Inter, sans-serif; color: #171826; resize: none"></textarea>
  </label>
  <button type="button" style="height: 48px; border-radius: 16px; border: 1.5px dashed #CBBFB2; background: transparent; display: flex; align-items: center; justify-content: center; gap: 8px; font: 600 14px Inter, sans-serif; color: #171826"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg>Add a photo of your look</button>
  <div style="flex-grow: 1"></div>
  <a href="MyBookings.html" style="display: flex; align-items: center; justify-content: center; height: 54px; border-radius: 999px; background: #171826; color: #FFFFFF; text-decoration: none; font-size: 15px; font-weight: 600">Post review</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#F4A942","options":["#F4A942","#171826","#D58E39"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { rating: 5, tags: ['On time', 'Great result'] };
  }
  renderVals() {
    const accent = this.props.accent ?? '#F4A942';
    const s = this.state || { rating: 5, tags: ['On time', 'Great result'] };
    const words = ['', 'Not great', 'Could be better', 'Good', 'Really good', 'Loved it'];
    const stars = [1, 2, 3, 4, 5].map((n) => ({
      checked: s.rating === n,
      label: n + (n === 1 ? ' star' : ' stars'),
      fill: n <= s.rating ? accent : 'none',
      stroke: n <= s.rating ? accent : '#CBBFB2',
      pick: () => this.setState({ rating: n })
    }));
    const tags = ['On time', 'Great result', 'Friendly', 'Clean space', 'Good value'].map((label) => {
      const on = s.tags.indexOf(label) !== -1;
      return {
        label, on,
        bg: on ? '#171826' : '#FFFFFF', fg: on ? '#FFFFFF' : '#171826', bd: on ? '#171826' : '#E5DFD5',
        pick: () => this.setState({ tags: on ? s.tags.filter((x) => x !== label) : s.tags.concat([label]) })
      };
    });
    return { accent, stars, tags, ratingWord: words[s.rating] };
  }
}
</script>
</body>
</html>
