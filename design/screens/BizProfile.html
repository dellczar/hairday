<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hairday · Business profile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#171826}a:hover{color:#8F5A0E}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F7F4EE; color: #171826; font-family: Inter, system-ui, sans-serif; position: relative; overflow: hidden; display: flex; flex-direction: column">
  <div style="padding: 56px 20px 0; display: flex; flex-direction: column; gap: 14px; flex-grow: 1">
    <div style="display: flex; align-items: center; gap: 12px">
      <div role="img" aria-label="Salon logo" style="width: 52px; height: 52px; border-radius: 16px; background: #C4B3A2; flex-shrink: 0"></div>
      <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-family: 'Instrument Serif', serif; font-size: 28px; line-height: 1">Lisa's Salon</span><span style="font-size: 13px; color: #5D6070">Hair salon · Live on Hairday</span></div>
      <a href="Salon.html" style="height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid #E5DFD5; background: #FFFFFF; display: flex; align-items: center; text-decoration: none; font-size: 13px; font-weight: 600">Preview</a>
    </div>
    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px">
      <div style="height: 76px; border-radius: 12px; background: #CBBFB2"></div>
      <div style="height: 76px; border-radius: 12px; background: #BFAE9C"></div>
      <div style="height: 76px; border-radius: 12px; background: #D8CCBF"></div>
      <button type="button" aria-label="Add photos" style="height: 76px; border-radius: 12px; border: 1.5px dashed #CBBFB2; background: transparent; display: flex; align-items: center; justify-content: center; color: #5D6070; padding: 0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
    </div>
    <div style="background: #FFFFFF; border: 1px solid #ECE6DC; border-radius: 18px; padding: 0 14px">
      <a href="Services.html" style="display: flex; align-items: center; gap: 12px; min-height: 54px; border-bottom: 1px solid #EFEAE2; text-decoration: none"><span style="flex-grow: 1; font-size: 15px">Services</span><span style="font-size: 13px; color: #5D6070">4</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5D6070" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></a>
      <a href="Team.html" style="display: flex; align-items: center; gap: 12px; min-height: 54px; border-bottom: 1px solid #EFEAE2; text-decoration: none"><span style="flex-grow: 1; font-size: 15px">Team</span><span style="font-size: 13px; color: #5D6070">3 professionals</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5D6070" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></a>
      <a href="Setup.html" style="display: flex; align-items: center; gap: 12px; min-height: 54px; border-bottom: 1px solid #EFEAE2; text-decoration: none"><span style="flex-grow: 1; font-size: 15px">Location &amp; hours</span><span style="font-size: 13px; color: #5D6070">555 Main St</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5D6070" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></a>
      <a href="Payouts.html" style="display: flex; align-items: center; gap: 12px; min-height: 54px; text-decoration: none"><span style="flex-grow: 1; font-size: 15px">Payouts</span><span style="font-size: 13px; color: #8F5A0E; font-weight: 600">Finish setup</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5D6070" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></a>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px"><span style="font-size: 13px; font-weight: 600">Amenities</span>
      <div style="display: flex; flex-wrap: wrap; gap: 6px">
        <sc-for list="{{amen}}" as="a" hint-placeholder-count="5"><button type="button" aria-pressed="{{a.on}}" onClick="{{a.pick}}" style="height: 36px; padding: 0 12px; border-radius: 999px; border: 1px solid {{a.bd}}; background: {{a.bg}}; color: {{a.fg}}; font: 500 13px Inter, sans-serif">{{a.label}}</button></sc-for>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px"><span style="font-size: 13px; font-weight: 600">Cancellation policy</span>
      <div style="background: #FFFFFF; border: 1px solid #ECE6DC; border-radius: 18px; padding: 0 14px">
        <div style="display: flex; align-items: center; justify-content: space-between; min-height: 50px; border-bottom: 1px solid #EFEAE2; font-size: 15px"><span>Free cancellation until</span><span style="font-weight: 600">24 hr before</span></div>
        <div style="display: flex; align-items: center; justify-content: space-between; min-height: 50px; font-size: 15px"><span>Late cancel or no-show</span><span style="font-weight: 600">50% charge</span></div>
      </div>
    </div>
  </div>
  <nav aria-label="Business" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding: 8px 8px 26px; background: #FFFFFF; border-top: 1px solid #E5DFD5">
    <a href="OwnerToday.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 48px; text-decoration: none; color: #5D6070; font-size: 11px; font-weight: 500"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"></rect><path d="M4 10h16M9 3v4M15 3v4"></path></svg>Today</a>
    <a href="Availability.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 48px; text-decoration: none; color: #5D6070; font-size: 11px; font-weight: 500"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="8"></circle><path d="M12 8v4l3 2"></path></svg>Hours</a>
    <a href="Clients.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 48px; text-decoration: none; color: #5D6070; font-size: 11px; font-weight: 500"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20c1-3.5 3.5-5.5 6.5-5.5s5.5 2 6.5 5.5M16 4.5a3.5 3.5 0 010 7M18 14.8c1.8.7 3 2.5 3.5 5.2"></path></svg>Clients</a>
    <a href="BizProfile.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 48px; text-decoration: none; color: #171826; font-size: 11px; font-weight: 600"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M4 9l2-5h12l2 5M4 9v11h16V9M4 9h16"></path></svg>Business</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#F4A942","options":["#F4A942","#171826","#D58E39"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { on: ['Wi-Fi', 'Coffee', 'Wheelchair access'] };
  }
  renderVals() {
    const accent = this.props.accent ?? '#F4A942';
    const on = (this.state && this.state.on) || [];
    const amen = ['Wi-Fi', 'Coffee', 'Wheelchair access', 'Parking', 'Kid friendly', 'Restroom'].map((label) => {
      const sel = on.indexOf(label) !== -1;
      return {
        label, on: sel,
        bg: sel ? '#171826' : '#FFFFFF', fg: sel ? '#FFFFFF' : '#171826', bd: sel ? '#171826' : '#E5DFD5',
        pick: () => this.setState({ on: sel ? on.filter((x) => x !== label) : on.concat([label]) })
      };
    });
    return { accent, amen };
  }
}
</script>
</body>
</html>
