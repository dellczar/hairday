<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hairday · Owner services</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#171826}a:hover{color:#8F5A0E}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F7F4EE; color: #171826; font-family: Inter, system-ui, sans-serif; position: relative; overflow: hidden">
  <div style="padding: 52px 20px 0; display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; align-items: center; gap: 12px">
      <a href="BizProfile.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 50%; background: #FFFFFF; border: 1px solid #E5DFD5; display: flex; align-items: center; justify-content: center; color: #171826; flex-shrink: 0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></a>
      <span style="font-size: 17px; font-weight: 600; flex-grow: 1">Services</span>
      <button type="button" style="height: 44px; padding: 0 16px; border-radius: 999px; border: 0; background: #171826; color: #FFFFFF; font: 600 14px Inter, sans-serif; display: flex; align-items: center; gap: 6px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Add</button>
    </div>
    <span style="font-size: 12px; font-weight: 600; letter-spacing: 1.2px; color: #5D6070">HAIRCUT · 3</span>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <sc-for list="{{items}}" as="it" hint-placeholder-count="3">
        <button type="button" onClick="{{it.open}}" style="background: #FFFFFF; border: 1px solid #ECE6DC; border-radius: 16px; padding: 14px; display: flex; align-items: center; gap: 12px; text-align: left; font-family: Inter, sans-serif; color: #171826">
          <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 3px"><span style="font-size: 15px; font-weight: 600">{{it.name}}</span><span style="font-size: 13px; color: #5D6070">{{it.meta}}</span></span>
          <span style="font-size: 15px; font-weight: 600">{{it.price}}</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5D6070" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
        </button>
      </sc-for>
    </div>
    <span style="font-size: 12px; font-weight: 600; letter-spacing: 1.2px; color: #5D6070; margin-top: 6px">BRAIDS · 1</span>
    <div style="background: #FFFFFF; border: 1px solid #ECE6DC; border-radius: 16px; padding: 14px; display: flex; align-items: center; gap: 12px">
      <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 3px"><span style="font-size: 15px; font-weight: 600">Box braids</span><span style="font-size: 13px; color: #5D6070">3 hr · Jade</span></span>
      <span style="font-size: 15px; font-weight: 600">$180</span>
    </div>
  </div>

  <sc-if value="{{editing}}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; inset: 0; background: rgba(23,24,38,.45)">
      <div role="dialog" aria-label="Edit service" style="position: absolute; left: 0; right: 0; bottom: 0; background: #F7F4EE; border-radius: 28px 28px 0 0; padding: 10px 20px 30px; display: flex; flex-direction: column; gap: 16px">
        <div style="width: 40px; height: 5px; border-radius: 3px; background: #CBBFB2; margin: 0 auto"></div>
        <div style="display: flex; align-items: center; justify-content: space-between"><span style="font-family: 'Instrument Serif', serif; font-size: 28px">{{current.name}}</span><button type="button" aria-label="Close" onClick="{{close}}" style="width: 44px; height: 44px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; color: #171826; padding: 0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button></div>
        <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600">Price<input value="{{current.price}}" style="height: 52px; border: 1px solid #E5DFD5; border-radius: 14px; background: #FFFFFF; padding: 0 14px; font: 400 15px Inter, sans-serif; color: #171826"></label>
        <div style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 13px; font-weight: 600">Duration</span>
          <div style="display: flex; align-items: center; justify-content: space-between; height: 52px; border: 1px solid #E5DFD5; border-radius: 14px; background: #FFFFFF; padding: 0 6px">
            <button type="button" aria-label="15 minutes shorter" onClick="{{less}}" style="width: 44px; height: 40px; border-radius: 10px; border: 0; background: #F7F4EE; font: 600 20px Inter, sans-serif; color: #171826">−</button>
            <span style="font-size: 15px; font-weight: 600">{{durText}}</span>
            <button type="button" aria-label="15 minutes longer" onClick="{{more}}" style="width: 44px; height: 40px; border-radius: 10px; border: 0; background: #F7F4EE; font: 600 20px Inter, sans-serif; color: #171826">+</button>
          </div>
        </div>
        <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600">Description<textarea rows="2" style="border: 1px solid #E5DFD5; border-radius: 14px; background: #FFFFFF; padding: 12px 14px; font: 400 15px Inter, sans-serif; color: #171826; resize: none">Looking for a quick cut? This is the one for you.</textarea></label>
        <div style="display: flex; align-items: center; justify-content: space-between; font-size: 15px"><span>Show on my profile</span><span style="width: 48px; height: 28px; border-radius: 999px; background: #171826; box-sizing: border-box; padding: 3px; display: flex; justify-content: flex-end"><span style="width: 22px; height: 22px; border-radius: 50%; background: #FFFFFF; display: block"></span></span></div>
        <button type="button" onClick="{{close}}" style="height: 54px; border-radius: 999px; border: 0; background: #171826; color: #FFFFFF; font: 600 15px Inter, sans-serif">Save changes</button>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#F4A942","options":["#F4A942","#171826","#D58E39"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { edit: 0, dur: [30, 45, 60] };
  }
  renderVals() {
    const accent = this.props.accent ?? '#F4A942';
    const s = this.state || { edit: 0, dur: [30, 45, 60] };
    const fmt = (m) => (m >= 60 ? Math.floor(m / 60) + ' hr' + (m % 60 ? ' ' + (m % 60) + ' min' : '') : m + ' min');
    const base = [
      { name: 'Adult cut', price: '$30', who: '3 pros' },
      { name: 'Cut & shampoo', price: '$35', who: '3 pros' },
      { name: 'Cut, shampoo & style', price: '$40', who: '2 pros' }
    ];
    const items = base.map((b, i) => ({ ...b, meta: fmt(s.dur[i]) + ' · ' + b.who, open: () => this.setState({ edit: i }) }));
    const e = s.edit;
    const setDur = (d) => { const a = s.dur.slice(); a[e] = Math.min(480, Math.max(15, a[e] + d)); this.setState({ dur: a }); };
    return {
      accent, items,
      editing: e !== null && e !== undefined,
      current: e !== null && e !== undefined ? base[e] : base[0],
      durText: e !== null && e !== undefined ? fmt(s.dur[e]) : '',
      less: () => setDur(-15),
      more: () => setDur(15),
      close: () => this.setState({ edit: null })
    };
  }
}
</script>
</body>
</html>
