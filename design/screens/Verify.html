<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hairday · Verify email</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#171826}a:hover{color:#8F5A0E}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F7F4EE; color: #171826; font-family: Inter, system-ui, sans-serif; position: relative; overflow: hidden; display: flex; flex-direction: column; padding: 52px 20px 34px">
  <a href="Welcome.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 50%; background: #FFFFFF; border: 1px solid #E5DFD5; display: flex; align-items: center; justify-content: center; color: #171826"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></a>
  <h1 style="margin: 28px 0 10px; font-family: 'Instrument Serif', serif; font-weight: 400; font-size: 40px; line-height: 1.02; letter-spacing: -1px">Check your <em style="color: #8F5A0E">inbox.</em></h1>
  <p style="margin: 0; font-size: 15px; line-height: 1.45; color: #5D6070">We sent a 6-digit code to <strong style="color: #171826">lana@icloud.com</strong>. It expires in 10 minutes.</p>
  <div role="group" aria-label="Verification code" style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; margin-top: 28px">
    <input aria-label="Digit 1" value="4" maxlength="1" style="height: 60px; border-radius: 14px; border: 1px solid #E5DFD5; background: #FFFFFF; text-align: center; font: 600 24px Inter, sans-serif; color: #171826; width: 100%; box-sizing: border-box">
    <input aria-label="Digit 2" value="8" maxlength="1" style="height: 60px; border-radius: 14px; border: 1px solid #E5DFD5; background: #FFFFFF; text-align: center; font: 600 24px Inter, sans-serif; color: #171826; width: 100%; box-sizing: border-box">
    <input aria-label="Digit 3" value="2" maxlength="1" style="height: 60px; border-radius: 14px; border: 1px solid #E5DFD5; background: #FFFFFF; text-align: center; font: 600 24px Inter, sans-serif; color: #171826; width: 100%; box-sizing: border-box">
    <input aria-label="Digit 4" value="" maxlength="1" style="height: 60px; border-radius: 14px; border: 2px solid {{accent}}; background: #FFFFFF; text-align: center; font: 600 24px Inter, sans-serif; color: #171826; width: 100%; box-sizing: border-box">
    <input aria-label="Digit 5" value="" maxlength="1" style="height: 60px; border-radius: 14px; border: 1px solid #E5DFD5; background: #FFFFFF; text-align: center; font: 600 24px Inter, sans-serif; color: #171826; width: 100%; box-sizing: border-box">
    <input aria-label="Digit 6" value="" maxlength="1" style="height: 60px; border-radius: 14px; border: 1px solid #E5DFD5; background: #FFFFFF; text-align: center; font: 600 24px Inter, sans-serif; color: #171826; width: 100%; box-sizing: border-box">
  </div>
  <p style="margin: 18px 0 0; font-size: 14px; color: #5D6070">Didn't get it? <button type="button" style="border: 0; background: transparent; padding: 0; min-height: 44px; font: 600 14px Inter, sans-serif; color: #171826; text-decoration: underline; text-underline-offset: 3px">Resend in 0:42</button></p>
  <div style="background: #F3EADB; border-radius: 16px; padding: 14px 16px; display: flex; gap: 12px; font-size: 13px; line-height: 1.45; color: #2B2E40; margin-top: 12px">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true" style="flex-shrink: 0"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v5M12 8v.5"></path></svg>
    <span>No password to remember. We'll send a fresh code whenever you sign in.</span>
  </div>
  <div style="flex-grow: 1"></div>
  <a href="Main.html" style="display: flex; align-items: center; justify-content: center; height: 54px; border-radius: 999px; background: #171826; color: #FFFFFF; text-decoration: none; font-size: 15px; font-weight: 600">Verify and continue</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#F4A942","options":["#F4A942","#171826","#D58E39"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#F4A942' };
  }
}
</script>
</body>
</html>
