<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hairday · Availability</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#171826}a:hover{color:#8F5A0E}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F7F4EE; color: #171826; font-family: Inter, system-ui, sans-serif; position: relative; overflow: hidden">
  <div style="padding: 52px 20px 0; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; align-items: center; gap: 12px">
      <a href="OwnerToday.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 50%; background: #FFFFFF; border: 1px solid #E5DFD5; display: flex; align-items: center; justify-content: center; color: #171826; flex-shrink: 0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></a>
      <span style="font-size: 17px; font-weight: 600; flex-grow: 1">Availability</span>
      <button type="button" style="height: 44px; padding: 0 18px; border-radius: 999px; border: 0; background: {{accent}}; color: #171826; font: 600 14px Inter, sans-serif">Save</button>
    </div>
    <button type="button" style="background: #FFFFFF; border: 1px solid #ECE6DC; border-radius: 16px; padding: 12px 14px; display: flex; align-items: center; gap: 12px; text-align: left; font-family: Inter, sans-serif; color: #171826">
      <span style="width: 44px; height: 44px; border-radius: 50%; background: #D8CCBF; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; flex-shrink: 0">AO</span>
      <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 600">April Olson</span><span style="font-size: 13px; color: #5D6070">Hair stylist</span></span>
      <span style="font-size: 14px; font-weight: 600">Switch</span>
    </button>
    <h2 style="margin: 4px 0 0; font-size: 15px; font-weight: 600">Weekly hours</h2>
    <div style="background: #FFFFFF; border: 1px solid #ECE6DC; border-radius: 16px; padding: 0 14px">
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="7">
        <div style="display: flex; align-items: center; gap: 10px; min-height: 52px; border-bottom: 1px solid {{r.line}}">
          <span style="width: 92px; font-size: 15px; font-weight: 500">{{r.day}}</span>
          <span style="flex-grow: 1; font-size: 14px; color: {{r.hoursColor}}">{{r.hours}}</span>
          <button type="button" role="switch" aria-checked="{{r.on}}" aria-label="{{r.label}}" onClick="{{r.toggle}}" style="width: 56px; height: 44px; border: 0; background: transparent; padding: 0; display: flex; align-items: center; justify-content: center">
            <span style="width: 48px; height: 28px; border-radius: 999px; background: {{r.track}}; box-sizing: border-box; padding: 3px; display: flex; justify-content: {{r.justify}}">
              <span style="width: 22px; height: 22px; border-radius: 50%; background: #FFFFFF; display: block"></span>
            </span>
          </button>
        </div>
      </sc-for>
    </div>
    <h2 style="margin: 4px 0 0; font-size: 15px; font-weight: 600">Breaks &amp; time off</h2>
    <div style="background: #FFFFFF; border: 1px solid #ECE6DC; border-radius: 16px; padding: 12px 14px; display: flex; align-items: center; justify-content: space-between">
      <div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 500">Lunch</span><span style="font-size: 13px; color: #5D6070">1:00 – 1:30 PM, every working day</span></div>
      <button type="button" style="border: 0; background: transparent; font: 600 14px Inter, sans-serif; color: #171826; min-height: 44px">Edit</button>
    </div>
    <button type="button" style="height: 48px; border-radius: 16px; border: 1.5px dashed #CBBFB2; background: transparent; display: flex; align-items: center; justify-content: center; gap: 8px; font: 600 14px Inter, sans-serif; color: #171826"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Add time off</button>
    <span style="font-size: 12px; color: #5D6070">Changes only affect new bookings. Existing appointments stay as they are.</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#F4A942","options":["#F4A942","#171826","#D58E39"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { on: [true, false, true, true, true, true, true] };
  }
  renderVals() {
    const accent = this.props.accent ?? '#F4A942';
    const on = (this.state && this.state.on) || [true, false, true, true, true, true, true];
    const days = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];
    const hours = ['10:00 AM – 8:00 PM', '10:00 AM – 8:00 PM', '10:00 AM – 8:00 PM', '10:00 AM – 8:00 PM', '10:00 AM – 8:00 PM', '9:00 AM – 6:00 PM', '10:00 AM – 4:00 PM'];
    const rows = days.map((day, i) => ({
      day,
      on: on[i],
      label: day + ' working',
      hours: on[i] ? hours[i] : 'Day off',
      hoursColor: on[i] ? '#171826' : '#5D6070',
      track: on[i] ? '#171826' : '#CBBFB2',
      justify: on[i] ? 'flex-end' : 'flex-start',
      line: i === days.length - 1 ? 'transparent' : '#EFEAE2',
      toggle: () => {
        const next = on.slice();
        next[i] = !next[i];
        this.setState({ on: next });
      }
    }));
    return { accent, rows };
  }
}
</script>
</body>
</html>
