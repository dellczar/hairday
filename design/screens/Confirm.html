<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hairday · Review and pay</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#171826}a:hover{color:#8F5A0E}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F7F4EE; color: #171826; font-family: Inter, system-ui, sans-serif; position: relative; overflow: hidden">
  <div style="padding: 52px 20px 0; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; align-items: center; gap: 12px">
      <a href="Book.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 50%; background: #FFFFFF; border: 1px solid #E5DFD5; display: flex; align-items: center; justify-content: center; color: #171826; flex-shrink: 0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></a>
      <span style="font-size: 17px; font-weight: 600">Review &amp; pay</span>
    </div>
    <div style="background: #FFFFFF; border-radius: 20px; border: 1px solid #ECE6DC; padding: 16px; display: flex; flex-direction: column; gap: 14px">
      <div style="display: flex; align-items: center; gap: 12px">
        <div role="img" aria-label="Salon photo" style="width: 56px; height: 56px; border-radius: 14px; background: #C4B3A2; flex-shrink: 0"></div>
        <div style="display: flex; flex-direction: column; gap: 2px"><span style="font-family: 'Instrument Serif', serif; font-size: 24px; line-height: 1">Lisa's Salon</span><span style="font-size: 13px; color: #5D6070">555 Main St, Suite 6</span></div>
      </div>
      <div style="height: 1px; background: #EFEAE2"></div>
      <div style="display: flex; align-items: center; gap: 12px; font-size: 14px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5D6070" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"></rect><path d="M4 10h16M9 3v4M15 3v4"></path></svg>Saturday, 14 November · 2:30 PM</div>
      <div style="display: flex; align-items: center; gap: 12px; font-size: 14px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5D6070" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="8"></circle><path d="M12 8v4l3 2"></path></svg>Adult cut · 30 min</div>
      <div style="display: flex; align-items: center; gap: 12px; font-size: 14px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5D6070" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 20c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg>April Olson, hair stylist</div>
    </div>
    <div style="background: #FFFFFF; border-radius: 20px; border: 1px solid #ECE6DC; padding: 16px; display: flex; flex-direction: column; gap: 10px; font-size: 14px">
      <div style="display: flex; justify-content: space-between"><span>Adult cut</span><span>$30.00</span></div>
      <div style="display: flex; justify-content: space-between; color: #5D6070"><span>Booking fee</span><span>[YOUR FEE]</span></div>
      <div style="display: flex; justify-content: space-between; color: #5D6070"><span>Tip</span><span>{{tipAmt}}</span></div>
      <div style="height: 1px; background: #EFEAE2"></div>
      <div style="display: flex; justify-content: space-between; font-size: 16px; font-weight: 600"><span>Total</span><span>[TOTAL]</span></div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 14px; font-weight: 600">Add a tip for April</span>
      <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
        <sc-for list="{{tips}}" as="t" hint-placeholder-count="4"><button type="button" aria-pressed="{{t.on}}" onClick="{{t.pick}}" style="height: 44px; border-radius: 12px; border: 1px solid {{t.bd}}; background: {{t.bg}}; color: {{t.fg}}; font: 600 14px Inter, sans-serif">{{t.label}}</button></sc-for>
      </div>
    </div>
    <button type="button" style="background: #FFFFFF; border-radius: 16px; border: 1px solid #ECE6DC; padding: 0 16px; height: 56px; display: flex; align-items: center; gap: 12px; font: 500 14px Inter, sans-serif; color: #171826; text-align: left">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="2"></rect><path d="M3 10h18"></path></svg>
      <span style="flex-grow: 1">Visa ending 4242</span>
      <span style="font-weight: 600">Change</span>
    </button>
    <div style="background: #F3EADB; border-radius: 16px; padding: 14px 16px; display: flex; gap: 12px; font-size: 13px; line-height: 1.45; color: #2B2E40">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6z"></path></svg>
      <span>Free cancellation up to 24 hours before. After that, 50% is charged.</span>
    </div>
  </div>
  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 20px 30px; background: #F7F4EE">
    <a href="Booked.html" style="display: flex; align-items: center; justify-content: center; height: 54px; border-radius: 999px; background: {{accent}}; color: #171826; text-decoration: none; font: 600 16px Inter, sans-serif">Confirm booking</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#F4A942","options":["#F4A942","#171826","#D58E39"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { tip: 18 };
  }
  renderVals() {
    const accent = this.props.accent ?? '#F4A942';
    const tip = this.state && this.state.tip !== undefined ? this.state.tip : 18;
    const tips = [15, 18, 20, 0].map((p) => {
      const on = tip === p;
      return {
        label: p === 0 ? 'None' : p + '%', on,
        bg: on ? '#171826' : '#FFFFFF', fg: on ? '#FFFFFF' : '#171826', bd: on ? '#171826' : '#E5DFD5',
        pick: () => this.setState({ tip: p })
      };
    });
    return { accent, tips, tipAmt: '$' + (30 * tip / 100).toFixed(2) };
  }
}
</script>
</body>
</html>
