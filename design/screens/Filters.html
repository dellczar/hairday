<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hairday · Filters</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#171826}a:hover{color:#8F5A0E}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #7D7F8C; color: #171826; font-family: Inter, system-ui, sans-serif; position: relative; overflow: hidden">
  <div style="position: absolute; left: 0; right: 0; bottom: 0; top: 64px; background: #F7F4EE; border-radius: 28px 28px 0 0; display: flex; flex-direction: column">
    <div style="width: 40px; height: 5px; border-radius: 3px; background: #CBBFB2; margin: 10px auto 0"></div>
    <div style="padding: 10px 20px 0; display: flex; align-items: center; justify-content: space-between">
      <a href="Results.html" aria-label="Close filters" style="width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #171826"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
      <span style="font-size: 17px; font-weight: 600">Filters</span>
      <button type="button" onClick="{{reset}}" style="border: 0; background: transparent; min-height: 44px; font: 500 14px Inter, sans-serif; color: #171826; text-decoration: underline; text-underline-offset: 3px">Reset</button>
    </div>
    <div style="padding: 8px 20px 0; display: flex; flex-direction: column; gap: 22px">
      <div style="display: flex; flex-direction: column; gap: 10px">
        <h2 style="margin: 0; font-size: 15px; font-weight: 600">Service</h2>
        <div style="display: flex; flex-wrap: wrap; gap: 8px">
          <sc-for list="{{services}}" as="s" hint-placeholder-count="8">
            <button type="button" onClick="{{s.pick}}" aria-pressed="{{s.on}}" style="height: 40px; padding: 0 16px; border-radius: 999px; border: 1px solid {{s.bd}}; background: {{s.bg}}; color: {{s.fg}}; font: 500 14px Inter, sans-serif">{{s.label}}</button>
          </sc-for>
        </div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 10px">
        <h2 style="margin: 0; font-size: 15px; font-weight: 600">When</h2>
        <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
          <sc-for list="{{whens}}" as="w" hint-placeholder-count="3">
            <button type="button" onClick="{{w.pick}}" aria-pressed="{{w.on}}" style="height: 48px; border-radius: 14px; border: 1px solid {{w.bd}}; background: {{w.bg}}; color: {{w.fg}}; font: 500 14px Inter, sans-serif">{{w.label}}</button>
          </sc-for>
        </div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 10px">
        <div style="display: flex; justify-content: space-between; align-items: baseline"><h2 style="margin: 0; font-size: 15px; font-weight: 600">Price</h2><span style="font-size: 14px; color: #5D6070">$20 – $80</span></div>
        <div style="position: relative; height: 28px">
          <div style="position: absolute; left: 0; right: 0; top: 12px; height: 4px; border-radius: 2px; background: #E5DFD5"></div>
          <div style="position: absolute; left: 12%; right: 40%; top: 12px; height: 4px; border-radius: 2px; background: {{accent}}"></div>
          <div style="position: absolute; left: calc(12% - 14px); top: 0; width: 28px; height: 28px; border-radius: 50%; background: #FFFFFF; border: 1px solid #CBBFB2; box-sizing: border-box"></div>
          <div style="position: absolute; left: calc(60% - 14px); top: 0; width: 28px; height: 28px; border-radius: 50%; background: #FFFFFF; border: 1px solid #CBBFB2; box-sizing: border-box"></div>
        </div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 4px">
        <h2 style="margin: 0 0 4px; font-size: 15px; font-weight: 600">Sort by</h2>
        <sc-for list="{{sorts}}" as="o" hint-placeholder-count="3">
          <button type="button" role="radio" aria-checked="{{o.on}}" onClick="{{o.pick}}" style="min-height: 48px; border: 0; border-bottom: 1px solid #ECE6DC; background: transparent; padding: 0; display: flex; align-items: center; justify-content: space-between; font: 500 15px Inter, sans-serif; color: #171826; text-align: left">
            {{o.label}}
            <span style="width: 22px; height: 22px; border-radius: 50%; box-sizing: border-box; border: {{o.ring}}; display: block"></span>
          </button>
        </sc-for>
      </div>
    </div>
    <div style="flex-grow: 1"></div>
    <div style="padding: 14px 20px 30px; border-top: 1px solid #E5DFD5; background: #FFFFFF">
      <a href="Results.html" style="display: flex; align-items: center; justify-content: center; height: 54px; border-radius: 999px; background: #171826; color: #FFFFFF; text-decoration: none; font-size: 15px; font-weight: 600">Show 24 salons</a>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#F4A942","options":["#F4A942","#171826","#D58E39"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { svc: ['Haircut'], when: 'Today', sort: 'Nearest' };
  }
  renderVals() {
    const accent = this.props.accent ?? '#F4A942';
    const s = this.state || { svc: ['Haircut'], when: 'Today', sort: 'Nearest' };
    const chip = (on) => ({ bg: on ? '#171826' : '#FFFFFF', fg: on ? '#FFFFFF' : '#171826', bd: on ? '#171826' : '#E5DFD5' });
    const services = ['Haircut', 'Barber', 'Braids', 'Color', 'Nails', 'Lashes', 'Brows', 'Makeup'].map((label) => {
      const on = s.svc.indexOf(label) !== -1;
      return { label, on, ...chip(on), pick: () => this.setState({ svc: on ? s.svc.filter((x) => x !== label) : s.svc.concat([label]) }) };
    });
    const whens = ['Today', 'Tomorrow', 'Pick date'].map((label) => {
      const on = s.when === label;
      return { label, on, ...chip(on), pick: () => this.setState({ when: label }) };
    });
    const sorts = ['Nearest', 'Top rated', 'Lowest price'].map((label) => {
      const on = s.sort === label;
      return { label, on, ring: on ? '7px solid #171826' : '1.5px solid #CBBFB2', pick: () => this.setState({ sort: label }) };
    });
    return {
      accent, services, whens, sorts,
      reset: () => this.setState({ svc: [], when: 'Today', sort: 'Nearest' })
    };
  }
}
</script>
</body>
</html>
